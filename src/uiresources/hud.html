<!DOCTYPE html>
<html>

<head>
    <script src='js/cohtml.js'></script>
    <script type="module" src='js/components.js'></script>
    <!-- PedalGraph mod: extra HUD widget (throttle / brake / clutch / handbrake traces) -->
    <script>window.PEDALGRAPH_SOURCE = "kspkg";</script>
    <script type="module" src='js/pedalgraph.js'></script>

    <link rel='stylesheet' type='text/css' href='css/ui.css'>
    <link rel='stylesheet' type='text/css' href='css/uicomponents.css'>
</head>

<body class="hud" data-bind-class-toggle="multiplayer:IsFlagSet(InSessionFlags.Multiplayer,{{ModelUISessionState}});disconnected:{{ModelUIState}}.online_status=='UIOnlineDisconnected';is-admin:{{ModelUIState}}.is_admin;is-spectator:{{ModelUIState}}.is_spectator;is-player-car:{{ModelCurrentCar}}.is_player_car">
    <ks-dev-reloadbutton></ks-dev-reloadbutton>
    <div class="absolutecenter">
        <ks-hud id="mainHUD"
            data-bind-if="{{ModelUIState}}.gamemode == GAMEMODETYPE.Racing"
            data-bind-process="APF().process({{ModelUISessionState}})"></ks-hud>
        <ks-hud-freeroam id="mainHUD"
            data-bind-if="{{ModelUIState}}.gamemode == GAMEMODETYPE.Freeroam"
            data-bind-process="APF().process({{ModelUISessionState}})"></ks-hud-freeroam>
        <!-- PedalGraph mod widget -->
        <ace-pedalgraph id="pedalgraph"></ace-pedalgraph>
    </div>
    <ks-modaldialog></ks-modaldialog>
</body>

</html>
