<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PedalGraph widget tests</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
  /* stand-in for the game's HUD container */
  .absolutecenter { position: relative; width: 1600px; height: 900px; overflow: hidden; }
  #results { white-space: pre; }
</style>
<!-- shared test doubles (fake frame clock, in-memory localStorage, console capture) from the loader repo -->
<script src="../../../ACEUIAppLoader/tests/lib/doubles.js"></script>
<script>
// Fake car model, mutable by tests.
window.ModelCurrentCar = { has_focused_car: true, gas_percent: 0.5, brake_percent: 0.25, clutch_percent: 0, handbrake_percent: 1, steering_percent: 0, abs_active: false, tc_active: false };
</script>
<!-- the ACEUIAppLoader library from the sibling checkout, in load order (in game it is part of cohtml.js) -->
<script src="../../../ACEUIAppLoader/tests/lib/lib.js"></script>
<link rel="stylesheet" type="text/css" href="../../pedalgraph/pedalgraph.css">
<!-- classic script, as the loader injects it: `PedalGraph` is a page-wide binding -->
<script src="../../pedalgraph/pedalgraph.js"></script>
</head>
<body>
<div class="absolutecenter" id="center"></div>
<pre id="results"></pre>
<div id="done" hidden></div>

<script>
(function () {
    const H = window.__harness;
    const t = H.t, eq = H.eq, ok = H.ok, near = H.near;
    // what the loader knows about this app; outside the game the title falls back to the name and the version reads "dev"
    const me = ACEUIAppLoader.app("pedalgraph");
    const scaleOf = function (el) { const m = /scaleY\((-?[\d.]+)\)/.exec(el.style.transform || ""); return m ? parseFloat(m[1]) : 0; };
    const scaleIs = function (el, v, what) { near(scaleOf(el), v, 1e-6, what); };
    /** A pedal's bar: translateY((1 - from) * 50%) skewY(deg); `to` is recovered through the graph's measured aspect. */
    const barOf = function (el) { const m = /translateY\((-?[\d.]+)%\) skewY\((-?[\d.]+)deg\)/.exec(el.style.transform || ""); return m ? { from: 1 - parseFloat(m[1]) / 50, skew: parseFloat(m[2]) } : null; };
    const barTo = function (b) { return b.from - Math.tan(b.skew * Math.PI / 180) / state.aspect; };
    const barIs = function (el, from, to, what) {
        const b = barOf(el);
        ok(b, what + ": a trapezoid, got " + JSON.stringify(el.style.transform));
        if (b) { near(b.from, from, 1e-5, what + " (left edge)"); near(barTo(b), to, 1e-3, what + " (right edge)"); }
    };
    const barEmpty = function (el, what) { eq(el.style.transform, "", what); };
    /** A centred (steering) transform, parsed: { shift: translateY %, scale: scaleY }. */
    const centredOf = function (el) {
        const m = /translateY\((-?[\d.]+)%\) scaleY\((-?[\d.]+)\)/.exec(el.style.transform || "");
        return m ? { shift: parseFloat(m[1]), scale: parseFloat(m[2]) } : null;
    };
    const centredIs = function (el, shift, scale, what) {
        const c = centredOf(el);
        ok(c, what + ": centred transform present, got " + JSON.stringify(el.style.transform));
        if (c) { near(c.shift, shift, 1e-6, what + " shift"); near(c.scale, scale, 1e-6, what + " scale"); }
    };


    const N = 250, HZ = 50, SAMPLE_MS = 1000 / HZ;
    const clock = window.__clock;
    const center = document.getElementById("center");

    t("library present, module present, constants as expected, load logged", function () {
        eq(typeof ACEUIAppLoader, "object", "ACEUIAppLoader library"); eq(typeof ACEUIAppLoader.panel, "object", "panel"); eq(typeof ACEUIAppLoader.loop, "object", "loop");
        eq(typeof PedalGraph, "object", "PedalGraph module");
        eq(PedalGraph.N, N, "N"); eq(PedalGraph.SAMPLE_HZ, HZ, "SAMPLE_HZ");
        eq(me.version, ACEUIAppLoader.loader.DEV_VERSION, "version comes from the loader"); eq(me.prefix, "[pedalgraph]");
        eq(me.hudId, "hud_pedalgraph"); eq(me.storageKey, "acepedalgraph.pos");
        ok(window.__log.some(function (l) { return l.indexOf(me.prefix + " script loaded, version " + me.version + ", library " + ACEUIAppLoader.VERSION) >= 0; }), "the library logs the script-loaded line for every app");
        eq(document.getElementById(me.name), null, "harness must not carry the auto-mount root");
        eq(typeof PedalGraph.VERSION, "undefined", "identity is the loader's, not re-exported");
    });

    const root = document.createElement("div");
    center.appendChild(root);
    let state = PedalGraph.attach(root);
    let tracks, bars, levels, vals;
    const grab = function () {
        tracks = Array.prototype.slice.call(root.querySelectorAll(".pg-track"));
        bars = tracks.map(function (el) { return Array.prototype.slice.call(el.querySelectorAll(".pg-bar")); });
        // by channel index, not DOM order: legend items and level bars are laid out in
        // reading order, and only the five inputs have a level bar and a readout
        const inputs = PedalGraph.TRACES.filter(function (trace) { return trace.kind !== PedalGraph.KIND.mark; });
        levels = inputs.map(function (trace, t) { return root.querySelector(".pg-lvl[data-trace=\"" + t + "\"] > div"); });
        vals = inputs.map(function (trace, t) { return root.querySelector(".pg-item[data-trace=\"" + t + "\"] .pg-val"); });
    };
    grab();
    const readingOrder = function (selector) {
        return Array.prototype.slice.call(root.querySelectorAll(selector)).map(function (el) { return el.getAttribute("data-trace"); }).join(",");
    };

    t("the legend, the level bars and the input switches share one reading order: clutch, brake, throttle, handbrake, steering; the marks after", function () {
        eq(readingOrder(".pg-row .pg-item"), "0,2,3,1,4", "legend in reading order");
        eq(readingOrder(".pg-lvl"), "0,2,3,1,4", "and the level bars match it");
        eq(readingOrder(".pg-legend.pg-marks .pg-item"), "5,6,7", "the marks after them, ABS, TC, ESC");
        eq(readingOrder(".pg-track"), "0,1,2,3,4,5,6,7", "the strips stay in channel order: they stack by z-index, nothing visible depends on it");
    });

    t("attach builds 8 strips x (2N + 1 spare) bars (4 pedals, steering, 3 marks), 5 levels, 5 readouts; panel and loop wired", function () {
        eq(PedalGraph.BAR_COUNT, 2 * N + 1, "two halves and one spare for the wrap");
        eq(tracks.length, 8, "strips"); bars.forEach(function (b) { eq(b.length, 2 * N + 1, "bars"); });
        eq(levels.length, 5, "levels: no level bar for a mark"); eq(vals.length, 5, "readouts: none for a mark");
        eq(root.querySelectorAll(".pg-item").length, 8, "a legend entry for every channel");
        eq(root.querySelectorAll(".pg-track.pg-mark").length, 3, "the marks' strips carry pg-mark");
        [4, 5, 6, 7].forEach(function (t) { ok(tracks[t].classList.contains("pg-off"), "channel " + t + " hidden by default"); });
        [0, 1, 2, 3].forEach(function (t) { ok(!tracks[t].classList.contains("pg-off"), "pedal " + t + " shown by default"); });
        eq(getComputedStyle(root).position, "absolute", "stylesheet applied");
        ok(root.classList.contains("ace-pedalgraph"), "root class");
        eq(clock.queue.length, 1, "one animation frame requested");
        eq(state.root, root, "state carries the root");
        eq(state.ui.panel.root, root, "panel attached to the root"); eq(state.ui.panel.hudId, me.hudId); eq(state.ui.panel.storageKey, me.storageKey);
        eq(root.style.visibility, "hidden", "hidden until positioned");
        ok(state.ui.loop && state.ui.loop.running, "loop running");
    });

    // channel order in the script: 0 clutch, 1 handbrake, 2 brake, 3 gas, 4 steering, 5 ABS, 6 TC, 7 ESC
    t("first frame samples nothing but renders live values and readouts", function () {
        clock.step(1000);
        eq(vals[3].textContent, "50%", "gas readout");
        eq(vals[1].textContent, "100%", "handbrake readout");
        scaleIs(levels[3], 0.5, "gas level");
        eq(root.querySelector(".pg-nodata").textContent, "", "nodata cleared");
    });

    t("history commits at the fixed rate into slot head+1 in both halves", function () {
        clock.step(1000 + SAMPLE_MS);          // exactly one sample period later
        ok(state.aspect > 0, "the graph has a size, so slopes can be drawn: aspect " + state.aspect);
        barIs(bars[3][1], 0, 0.5, "slot 1 climbs from nothing (no earlier sample) to the first sample");
        barIs(bars[3][1 + N], 0, 0.5, "slot 1+N");
        barIs(bars[3][2 + N], 0.5, 0.5, "slot 2 is the incoming live bar, written at the right edge only, level from the last sample to the live value");
        barEmpty(bars[3][2], "its twin at the left edge keeps the old sample (none yet)");
        barEmpty(bars[3][3], "slot 3 untouched");
        eq(bars[3][3 + N].style.transform, "scaleY(0)", "the bar that will be incoming next is blanked, so its stale content cannot show at the right edge");
        eq(state.head, 1, "head advanced");
    });

    t("strip slides continuously between samples", function () {
        const shiftAt = function (frac) { return -((1 + 1 + frac) / (2 * N)) * 100; };   // head is 1
        clock.step(1000 + SAMPLE_MS + SAMPLE_MS / 2);
        const m = /translateX\((-?[\d.]+)%\)/.exec(tracks[3].style.transform);
        ok(m, "no translate"); near(parseFloat(m[1]), shiftAt(0.5), 0.001, "half-way shift");
    });

    t("catches up after a short hitch without dropping history", function () {
        window.ModelCurrentCar.gas_percent = 0.8;
        clock.step(1000 + SAMPLE_MS * 6);       // 6 periods since start => slots 1..6 committed
        let i;
        barIs(bars[3][2], 0.5, 0.8, "slot 2 slopes from the earlier sample to the new value");
        for (i = 3; i <= 6; i += 1) { barIs(bars[3][i], 0.8, 0.8, "slot " + i); }
        barIs(bars[3][7 + N], 0.8, 0.8, "incoming slot 7 holds live value");
        barEmpty(bars[3][8], "slot 8 untouched");
        eq(state.head, 6, "head");
    });

    t("a stall longer than the window resets the clock instead of replaying", function () {
        window.ModelCurrentCar.gas_percent = 0.1;
        clock.step(1000 + SAMPLE_MS * 6 + 20000);   // 20 s stall
        barIs(bars[3][7 + N], 0.8, 0.1, "incoming slot slopes from the last sample to the live value");
        barEmpty(bars[3][8], "no mass replay into slot 8");
        eq(state.head, 6, "head unchanged by the stall");
        clock.step(1000 + SAMPLE_MS * 6 + 20000 + SAMPLE_MS);
        barIs(bars[3][7], 0.8, 0.1, "slot 7 committed as the slope");
        barIs(bars[3][8 + N], 0.1, 0.1, "slot 8 is the new incoming");
    });

    t("values are clamped to 0..1 and readouts only update on change", function () {
        window.ModelCurrentCar.gas_percent = 1.7;
        window.ModelCurrentCar.brake_percent = -0.4;
        const t0 = 60000;
        clock.step(t0);
        scaleIs(levels[3], 1.0, "gas clamped high");
        scaleIs(levels[2], 0.0, "brake clamped low");
        eq(vals[3].textContent, "100%"); eq(vals[2].textContent, "0%");
        const el = vals[3]; el.textContent = "sentinel";
        clock.step(t0 + 1);
        eq(el.textContent, "sentinel", "unchanged value must not rewrite the readout");
    });

    t("no focused car: nothing renders, sampler resets, no throw", function () {
        const before = tracks[3].style.transform;
        window.ModelCurrentCar.has_focused_car = false;
        clock.step(70000); clock.step(70016);
        eq(tracks[3].style.transform, before, "strip must not move");
        eq(state.sampler.lastSampleAt, 0, "sampler reset");
        eq(PedalGraph.readModel(), null, "readModel null without focused car");
        window.ModelCurrentCar = null;
        clock.step(70032);
        eq(PedalGraph.readModel(), null, "readModel null without model");
        window.ModelCurrentCar = { has_focused_car: true, gas_percent: 0.3, brake_percent: 0, clutch_percent: 0, handbrake_percent: 0 };
        clock.step(70048);
        scaleIs(levels[3], 0.3, "recovers when the model is back");
    });

    t("hidden HUD skips drawing but keeps recording", function () {
        document.body.classList.add(ACEUIAppLoader.HUD_HIDDEN_CLASS);
        const before = tracks[3].style.transform;
        const headBefore = state.head;
        clock.step(80000);
        clock.step(80000 + SAMPLE_MS * 3);
        eq(tracks[3].style.transform, before, "no draw while hidden");
        ok(state.head > headBefore, "history still recording");
        document.body.classList.remove(ACEUIAppLoader.HUD_HIDDEN_CLASS);
        clock.step(80000 + SAMPLE_MS * 3 + 1);
        ok(tracks[3].style.transform !== before, "draws again when visible");
    });

    const mouse = function (type, x, y, target) {
        (target || window).dispatchEvent(new MouseEvent(type, { clientX: x, clientY: y, bubbles: true }));
    };
    const makeHud = function (elements) {
        const hud = { currentLayout: "default", StoredData: { lastLayout: "default", layouts: { default: { elements: elements || {} } } } };
        hud.elementModified = function (id, props) { hud.StoredData.layouts.default.elements[id] = props; };
        return hud;
    };

    t("drag saves under PedalGraph's keys in localStorage and the stock HUD store", function () {
        window.HUD = makeHud();
        root.style.left = "100px"; root.style.top = "100px"; root.style.bottom = "auto";
        const r = root.getBoundingClientRect();
        mouse("mousedown", r.left + 10, r.top + 10, root);
        ok(root.classList.contains("dragging"), "dragging class for the stylesheet");
        mouse("mousemove", r.left + 210, r.top + 60); mouse("mouseup", 0, 0);
        eq(root.style.left, "300px", "moved");
        const c = center.getBoundingClientRect();
        const saved = JSON.parse(localStorage.getItem(me.storageKey));
        near(saved.fx, 300 / c.width, 0.001, "fx"); eq(saved.x, "300px", "pixel form kept");
        const entry = window.HUD.StoredData.layouts.default.elements[me.hudId];
        ok(entry && entry.x === "300px", "HUD store entry under hud_pedalgraph");
        ok(window.__log.some(function (l) { return l.indexOf(me.prefix + " position saved") >= 0 && l.indexOf("hud layout") >= 0; }), "save logged with the app prefix");
        window.HUD = null; localStorage.clear();
    });

    t("position is restored from the HUD store inside the frame loop and the widget is then shown", function () {
        window.HUD = makeHud({});
        window.HUD.StoredData.layouts.default.elements[me.hudId] = { fx: 0.25, fy: 0.5 };
        const root2 = document.createElement("div");
        center.appendChild(root2);
        const state2 = PedalGraph.attach(root2);
        eq(root2.style.visibility, "hidden", "hidden until placed"); eq(root2.style.left, "", "nothing applied synchronously");
        clock.step(105000);
        const c = center.getBoundingClientRect();
        eq(root2.style.left, Math.round(0.25 * c.width) + "px", "restored left"); eq(root2.style.top, Math.round(0.5 * c.height) + "px", "restored top");
        ok(state2.ui.panel.restored, "settled"); eq(root2.style.visibility, "", "shown");
        PedalGraph.detach(state2); root2.remove(); window.HUD = null;
    });

    const settings = ACEUIAppLoader.settings;
    const S = PedalGraph.SETTING;
    const has = function (el, cls) { return el.classList.contains(cls); };

    t("the options are declared once at load, under the loader's settings, so the drawer has a way in", function () {
        const specs = settings.specs("pedalgraph");
        const keys = specs.map(function (spec) { return spec.key; });
        const sections = specs.filter(function (spec) { return spec.type === "section"; }).map(function (spec) { return spec.key + (spec.columns === 2 ? "*" : "") + (spec.collapsed ? "!" : ""); });
        eq(sections.join(","), "layout,inputs*,marks*,look*!,stack!,demo!", "six sections: two-column where the rows are switches; Look, Draw order and Demo start folded");
        eq(keys.slice(0, 5).join(","), "layout,scale," + [S.window, S.height].join(",") + ",inputs", "Layout: the loader's scale spec, history and plot height");
        eq(keys.slice(5, 11).join(","), "showClutch,showBrake,showThrottle,showHandbrake,showSteering,marks", "one switch per input, in the legend's reading order");
        eq(keys.slice(11, 15).join(","), "markAbs,markTc,markEsc,look", "then the assist marks");
        eq(keys.slice(15).join(","), [S.weight, S.bg, S.legend, S.levels, S.readouts, S.grid, "stack", S.order, "demo", S.attract].join(","), "then the look, the draw order and the demo");
        eq(Object.keys(settings.all("pedalgraph")).indexOf("layout"), -1, "sections carry no value");
        const sw = function (spec) { return spec.swatch ? spec.swatch.className + "/" + spec.swatch.attrs["data-trace"] : "-"; };
        eq(specs.filter(function (s) { return s.key === "showBrake"; }).map(sw)[0], "pg-option-swatch/2", "a channel switch carries its colour chip, keyed like the legend swatch");
        const order = specs.filter(function (s) { return s.key === S.order; })[0];
        eq(order.items.map(sw).join(","), "pg-option-swatch/2,pg-option-swatch/0,pg-option-swatch/4,pg-option-swatch/1,pg-option-swatch/3", "so does every row of the draw order, in the default order");
        const chip = document.createElement("span"); chip.className = "pg-option-swatch"; chip.setAttribute("data-trace", "3"); document.body.appendChild(chip);
        eq(getComputedStyle(chip).backgroundColor, "rgb(68, 234, 120)", "and the stylesheet colours a chip outside the widget's root"); chip.remove();
        PedalGraph.TRACES.forEach(function (trace) { eq(settings.get("pedalgraph", trace.setting), trace.on, trace.setting + " default"); });
        eq(settings.get("pedalgraph", S.height), "normal"); eq(settings.get("pedalgraph", S.weight), "normal");
        eq(settings.get("pedalgraph", S.window), "5 s", "default window"); eq(settings.get("pedalgraph", S.bg), "dark");
        eq(settings.get("pedalgraph", "scale"), 1, "default scale");
    });

    t("panel scale: the settings value is the root's font-size in rem, clamped to the widget's bounds, and follows the window", function () {
        eq(root.style.fontSize, "1rem", "applied at attach");
        eq(state.scaler.bounds.min, 0.6); eq(state.scaler.bounds.max, 2); near(state.scaler.bounds.step, 0.1, 1e-9);
        settings.set("pedalgraph", "scale", 1.5);
        eq(root.style.fontSize, "1.5rem", "moving it in the settings window resizes the panel");
        state.scaler.nudge(1);
        eq(settings.get("pedalgraph", "scale"), 1.6, "and the handle writes back to the setting");
        settings.set("pedalgraph", "scale", 9);
        eq(root.style.fontSize, "2rem", "clamped to the max");
        settings.set("pedalgraph", "scale", 1);
        eq(root.style.fontSize, "1rem");
    });

    t("switching an input off hides its legend item, strip and level bar and stops drawing it; history keeps recording", function () {
        window.ModelCurrentCar = { has_focused_car: true, gas_percent: 0.6, brake_percent: 0.2, clutch_percent: 0, handbrake_percent: 0 };
        const items = PedalGraph.TRACES.map(function (trace, t) { return root.querySelector(".pg-item[data-trace=\"" + t + "\"]"); });
        const boxes = PedalGraph.TRACES.map(function (trace, t) { return root.querySelector(".pg-lvl[data-trace=\"" + t + "\"]"); });
        const t0 = 200000;
        clock.step(t0);
        settings.set("pedalgraph", "showThrottle", false);
        ok(has(items[3], "pg-off") && has(tracks[3], "pg-off") && has(boxes[3], "pg-off"), "throttle's three elements carry pg-off");
        eq(getComputedStyle(items[3]).display, "none", "the legend item is hidden (its own display: flex must not win)");
        eq(getComputedStyle(boxes[3]).display, "none", "the level bar is hidden");
        ok(!has(items[2], "pg-off") && !has(tracks[2], "pg-off"), "brake untouched");
        eq(state.shown[3], false, "the loop knows");
        eq(getComputedStyle(tracks[3]).display, "none", "the stylesheet hides it");
        const shiftBefore = tracks[3].style.transform;
        const readoutBefore = vals[3].textContent;
        window.ModelCurrentCar.gas_percent = 0.9;
        clock.step(t0 + SAMPLE_MS * 2);
        eq(tracks[3].style.transform, shiftBefore, "a hidden strip is not shifted");
        eq(vals[3].textContent, readoutBefore, "nor its readout written");
        ok(tracks[2].style.transform !== shiftBefore, "the others still draw");
        near(barTo(barOf(bars[3][state.head])), 0.9, 1e-3, "but its history slot was committed");
        settings.set("pedalgraph", "showThrottle", true);
        ok(!has(items[3], "pg-off") && !has(tracks[3], "pg-off") && !has(boxes[3], "pg-off"), "all three back");
        eq(state.lastScale[3], "", "cache cleared so the next frame rewrites it");
        clock.step(t0 + SAMPLE_MS * 2 + 1);
        eq(vals[3].textContent, "90%", "readout catches up on the first frame back");
        scaleIs(levels[3], 0.9, "so does the level bar");
    });

    t("level bars, readouts and grid are classes on the root, and hidden ones are not written to", function () {
        const t0 = 210000;
        clock.step(t0);
        settings.set("pedalgraph", S.levels, false);
        ok(has(root, "pg-nolevels"), "pg-nolevels"); eq(state.levelsOn, false);
        eq(getComputedStyle(root.querySelector(".pg-bars")).display, "none", "the stylesheet hides them");
        window.ModelCurrentCar.brake_percent = 0.7;
        clock.step(t0 + 16);
        scaleIs(levels[2], 0.2, "level bar not written while hidden (holds 0.2 from before)");
        eq(vals[2].textContent, "70%", "readout still written");
        settings.set("pedalgraph", S.levels, true);
        clock.step(t0 + 32);
        scaleIs(levels[2], 0.7, "level bar caught up");
        settings.set("pedalgraph", S.readouts, false);
        ok(has(root, "pg-noreadouts"), "pg-noreadouts"); eq(state.readoutsOn, false);
        window.ModelCurrentCar.brake_percent = 0.4;
        clock.step(t0 + 48);
        eq(vals[2].textContent, "70%", "readout not written while hidden");
        scaleIs(levels[2], 0.4, "level bar still written");
        settings.set("pedalgraph", S.readouts, true);
        clock.step(t0 + 64);
        eq(vals[2].textContent, "40%", "readout caught up");
        settings.set("pedalgraph", S.grid, false);
        ok(has(root, "pg-nogrid"), "pg-nogrid");
        eq(getComputedStyle(root.querySelector(".pg-grid")).display, "none", "grid lines hidden by the stylesheet");
        settings.set("pedalgraph", S.grid, true);
        ok(!has(root, "pg-nogrid"));
    });

    t("the live edge: at a commit the next sample's bar is entirely past the right clip, the newest committed bar ends 1.5 px past it, and the wrapped twin ends 1.5 px before the left clip", function () {
        // every bar is widened 1.5 px to the left, and the strip overhangs the graph by the
        // same amount on both sides (pedalgraph.css), so neither widened edge is on screen:
        // the right one followed the raw live value and wobbled every frame
        clock.step(236000);
        const t0 = state.sampler.lastSampleAt + SAMPLE_MS;
        clock.step(t0);                                     // exactly on the sampler's grid: a commit, frac 0
        const graph = root.querySelector(".pg-graph").getBoundingClientRect();
        const slot = (state.head + 1) % N;
        const incoming = bars[3][slot === 0 ? 2 * N : slot + N];
        const newest = bars[3][state.head + N];
        const twin = bars[3][state.head];
        const slotPx = (graph.width + 2 * PedalGraph.EDGE_PX) / N;
        ok(incoming.style.transform.indexOf("scaleY(0)") < 0, "the incoming bar is drawn");
        near(incoming.getBoundingClientRect().left, graph.right, 1 / 16, "the incoming bar starts at the clip: its widened edge is outside");
        near(newest.getBoundingClientRect().right, graph.right + PedalGraph.EDGE_PX, 1 / 16, "the newest committed bar's box ends past the clip by the widening: its own value sits exactly at the clip");
        near(twin.getBoundingClientRect().right, graph.left - PedalGraph.EDGE_PX, 1 / 16, "the newest slot's wrapped twin ends before the left clip: no hairline");
        clock.step(t0 + SAMPLE_MS / 2);                      // half way to the next sample
        near(incoming.getBoundingClientRect().left, graph.right - slotPx / 2, 1 / 16, "half a slot of the incoming bar is on screen half way through the period");
    });

    t("the assist marks have a legend line of their own, shown only while one is on, and the whole legend can go", function () {
        const marks = root.querySelector(".pg-legend.pg-marks");
        ok(marks, "a second legend line for the marks");
        eq(marks.querySelectorAll(".pg-item").length, 3, "the three marks live in it");
        eq(root.querySelector(".pg-row .pg-legend").querySelectorAll(".pg-item").length, 5, "the inputs stay on the first line, beside the status");
        ok(marks.classList.contains("pg-off"), "hidden while every mark is off, which is the default");
        eq(getComputedStyle(marks).display, "none");
        settings.set("pedalgraph", "markAbs", true);
        ok(!marks.classList.contains("pg-off"), "one mark on: the line appears");
        settings.set("pedalgraph", "markAbs", false);
        ok(marks.classList.contains("pg-off"), "and goes again when it is off");
        eq(settings.get("pedalgraph", S.legend), true, "the legend is on by default");
        settings.set("pedalgraph", S.legend, false);
        ok(root.classList.contains("pg-nolegend"), "legend off is a class on the root");
        eq(getComputedStyle(root.querySelector(".pg-header")).display, "none", "and the whole header is gone: only the graph");
        settings.set("pedalgraph", S.legend, true);
        ok(!root.classList.contains("pg-nolegend"));
    });

    t("background is one of three looks, two of them a class", function () {
        settings.set("pedalgraph", S.bg, "light");
        ok(has(root, "pg-bg-light") && !has(root, "pg-bg-none"), "light");
        settings.set("pedalgraph", S.bg, "none");
        ok(has(root, "pg-bg-none") && !has(root, "pg-bg-light"), "none");
        eq(getComputedStyle(root).backgroundColor, "rgba(0, 0, 0, 0)", "transparent");
        settings.set("pedalgraph", S.bg, "dark");
        ok(!has(root, "pg-bg-none") && !has(root, "pg-bg-light"), "dark is the stylesheet default");
        eq(settings.set("pedalgraph", S.bg, "purple"), "dark", "an unknown value falls back to the default");
    });

    t("history window: the same bars sampled at a new rate, a stall longer than the window resets", function () {
        near(state.sampler.periodMs, 20, 1e-9, "5 s over 250 bars is 50 Hz"); eq(state.sampler.maxGapMs, 5000);
        settings.set("pedalgraph", S.window, "10 s");
        near(state.sampler.periodMs, 40, 1e-9, "10 s is 25 Hz"); eq(state.sampler.maxGapMs, 10000);
        eq(root.querySelectorAll(".pg-bar").length, PedalGraph.TRACES.length * (2 * N + 1), "no bars added or removed");
        ok(window.__log.some(function (l) { return l.indexOf(me.prefix + " history window 10 s, 25 Hz") >= 0; }), "logged");
        settings.set("pedalgraph", S.window, "3 s");
        near(state.sampler.periodMs, 12, 1e-9, "3 s is 83 Hz");
        settings.set("pedalgraph", S.window, "5 s");
        near(state.sampler.periodMs, 20, 1e-9);
    });

    t("attract mode: the settings window drives it, it is restored through Escape/resume, and the console toggle writes back", function () {
        window.ModelCurrentCar.has_focused_car = false;              // no real car
        eq(root.querySelector(".pg-attract"), null, "no checkbox on the widget any more: the options window is the way in");
        eq(state.attract, false, "off by default");
        eq(PedalGraph.readModel(), null, "no car, no real data");
        const demo = PedalGraph.attractValues(3000);
        eq(demo.length, PedalGraph.TRACES.length, "one value per channel");
        ok(demo.slice(0, 4).every(function (x) { return x >= 0 && x <= 1; }), "pedals 0..1");
        ok(demo[4] >= -1 && demo[4] <= 1, "steering -1..1");
        ok(demo.slice(5).every(function (x) { return x === 0 || x === 1; }), "marks 0 or 1");
        let anyAbs = 0, anyTc = 0, anySteer = 0, i;
        for (i = 0; i < 14000; i += 100) { const d = PedalGraph.attractValues(i); anyAbs += d[5]; anyTc += d[6]; anySteer += Math.abs(d[4]); }
        ok(anyAbs > 0 && anyTc > 0 && anySteer > 0, "the demo exercises steering and the marks over a lap");
        settings.set("pedalgraph", S.attract, true);
        eq(state.attract, true, "moving it in the settings window turns the demo on");
        clock.step(220000); clock.step(220100);                      // it now renders demo data with no car
        eq(root.querySelector(".pg-nodata").textContent, "", "no-data message cleared while demoing");
        PedalGraph.detach(state); state = PedalGraph.attach(root);   // Escape/resume: the same game session
        eq(state.attract, true, "restored on");
        PedalGraph.attract(false); eq(settings.get("pedalgraph", S.attract), false, "the console toggle writes back");
        PedalGraph.attract(true); eq(state.attract, true);
        settings.set("pedalgraph", S.attract, false);
        eq(state.attract, false);
        window.ModelCurrentCar.has_focused_car = true;
    });

    t("attract mode lasts a game session: a restart switches it off, so a demo left on never shows on a real HUD; the key it lived under before is cleared", function () {
        settings.set("pedalgraph", S.attract, true);
        eq(state.attract, true, "on");
        PedalGraph.detach(state); state = PedalGraph.attach(root);
        eq(state.attract, true, "Escape/resume: still on, so a recording can go on across a pause");
        ACEUIAppLoader.persist.removeLocal("acepedalgraph.attractsession");   // the game closed: its local store went with it, the option did not
        const said = window.__log.length;
        PedalGraph.detach(state); state = PedalGraph.attach(root);
        eq(state.attract, false, "the next game session: off"); eq(settings.get("pedalgraph", S.attract), false, "and the option with it");
        ok(window.__log.slice(said).some(function (l) { return l.indexOf("left on from an earlier game session") >= 0; }), "and the log says why");
        ACEUIAppLoader.persist.writeLocal("acepedalgraph.attract", true);   // the key attract lived under before it was a setting
        PedalGraph.detach(state); state = PedalGraph.attach(root);
        eq(ACEUIAppLoader.persist.readLocal("acepedalgraph.attract"), null, "cleared at attach");
        eq(state.attract, false, "and it turns nothing on");
    });

    t("steering: signed, drawn from the centre line, readout says which way", function () {
        eq(PedalGraph.centredTransform(1), "translateY(-25.0000%) scaleY(0.500)", "full right: up from the centre, half the strip");
        eq(PedalGraph.centredTransform(-0.5), "translateY(12.5000%) scaleY(0.250)", "half left: down from the centre");
        eq(PedalGraph.centredTransform(0), "translateY(0.0000%) scaleY(0.000)", "straight: nothing");
        eq(PedalGraph.steerText(-0.42), "L 42%"); eq(PedalGraph.steerText(0.07), "R 7%"); eq(PedalGraph.steerText(0), "0%");
        window.ModelCurrentCar = { has_focused_car: true, gas_percent: 0.6, brake_percent: 0.2, clutch_percent: 0, handbrake_percent: 0, steering_percent: -3 };
        eq(PedalGraph.readModel()[4], -1, "clamped to -1..1, not 0..1: the stock speedo's range");
        window.ModelCurrentCar.steering_percent = -0.5;
        const t0 = 230000;
        clock.step(t0);
        eq(vals[4].textContent, "0%", "hidden by default: readout untouched");
        settings.set("pedalgraph", "showSteering", true);
        ok(!has(tracks[4], "pg-off") && !has(levels[4].parentNode, "pg-off"), "strip and level bar shown");
        clock.step(t0 + SAMPLE_MS);
        eq(state.head, 1, "one sample committed (at 50 Hz: an earlier case must leave the window at 5 s)");
        centredIs(bars[4][state.head], 12.5, 0.25, "history slot carries the centred transform");
        centredIs(levels[4], 12.5, 0.25, "so does the level bar");
        eq(vals[4].textContent, "L 50%", "readout");
        const bar = bars[4][0];
        // to a layout unit: the graph is snapped to whole pixels by its margins, so its
        // height can carry a 1/64 px the integer offsetHeight does not (see the loader's snap test)
        near(parseFloat(getComputedStyle(bar).transformOrigin.split(" ")[1]), bar.offsetHeight / 2, 1 / 32, "origin at the centre (stylesheet)");
        near(parseFloat(getComputedStyle(levels[4]).transformOrigin.split(" ")[1]), levels[4].offsetHeight / 2, 1 / 32, "level bar origin at the centre");
        settings.set("pedalgraph", "showSteering", false);
        window.ModelCurrentCar.steering_percent = 0;
    });

    t("trapezoids: a pedal's bar slopes from the previous sample to its own, on an element twice the graph tall; steering and marks stay flat", function () {
        const graph = root.querySelector(".pg-graph");
        eq(state.aspect, 0, "a view change clears the aspect: the layout it depends on is stale until the next frame");
        clock.step(234000);
        near(state.aspect, graph.offsetHeight * N / (graph.offsetWidth + 2 * PedalGraph.EDGE_PX), 1e-9, "the next frame measures it: graph height over bar width, in pixels, the slot being the strip's");
        const gr = graph.getBoundingClientRect();
        [gr.left, gr.right, gr.top, gr.bottom].forEach(function (edge, i) { near(edge, Math.round(edge), 1 / 32, "the graph's " + ["left", "right", "top", "bottom"][i] + " edge is on a whole pixel (to the 1/64 px layout unit), so the clip does not antialias a hairline"); });
        ok(graph.style.marginLeft !== "" || graph.style.marginRight !== "" || gr.left % 1 === 0, "snapped through its margins");
        state.scaler.set(1.3); clock.step(234020);
        const gr2 = graph.getBoundingClientRect();
        near(gr2.left, Math.round(gr2.left), 1 / 32, "still whole after a scale change re-fits it"); near(gr2.right, Math.round(gr2.right), 1 / 32);
        state.scaler.set(1); clock.step(234040);
        eq(PedalGraph.trapezoidTransform(0, 0.2, 0.6), "translateY(40.0000%) skewY(0.000deg)", "no aspect yet: a level bar at the left value");
        const t1 = PedalGraph.trapezoidTransform(77, 0.2, 0.6);
        eq(t1.indexOf("translateY(40.0000%) skewY(-"), 0, "a rise is a negative skew (up)"); near(parseFloat(/skewY\((-?[\d.]+)deg/.exec(t1)[1]), -Math.atan(0.4 * 77) * 180 / Math.PI, 1e-3);
        eq(PedalGraph.trapezoidTransform(77, 1, 1), "translateY(0.0000%) skewY(0.000deg)", "full and level: top edge at the graph's top");
        near(parseFloat(getComputedStyle(bars[3][0]).height), 2 * graph.getBoundingClientRect().height, 0.1, "a pedal's bar is twice the graph tall, so its sheared bottom stays below the graph");
        eq(getComputedStyle(bars[3][0]).transformOrigin, "0px 0px", "sheared about its top-left corner");
        settings.set("pedalgraph", "showSteering", true); settings.set("pedalgraph", "markAbs", true);
        near(parseFloat(getComputedStyle(bars[4][0]).height), graph.getBoundingClientRect().height, 0.1, "steering's bar is the graph's height"); eq(getComputedStyle(bars[5][0]).transformOrigin.split(" ")[1], "0px", "a mark's tick grows from the top");
        settings.set("pedalgraph", "showSteering", false); settings.set("pedalgraph", "markAbs", false);
        window.ModelCurrentCar = { has_focused_car: true, gas_percent: 0.2, brake_percent: 0, clutch_percent: 0, handbrake_percent: 0, steering_percent: 0.5 };
        const t0 = 235000;                                       // between the steering case and the marks case, which follows at 240 s
        clock.step(t0); clock.step(t0 + SAMPLE_MS);            // one sample at 0.2
        window.ModelCurrentCar.gas_percent = 0.6;
        clock.step(t0 + SAMPLE_MS * 2);                          // one at 0.6: its bar slopes 0.2 -> 0.6
        barIs(bars[3][state.head], 0.2, 0.6, "a committed bar slopes from the previous sample to its own");
        eq(bars[4][state.head].style.transform.indexOf("skewY"), -1, "steering's bar is not skewed");
        window.ModelCurrentCar.steering_percent = 0;
    });

    t("assist marks: a boolean becomes a 0/1 tick along the top, with a legend entry and no readout or level bar", function () {
        eq(state.vals[5], null, "no readout for a mark"); eq(state.levels[5], null, "no level bar for a mark"); eq(state.levelBoxes[5], null);
        ok(has(state.items[5], "pg-mark"), "legend entry carries pg-mark"); eq(state.items[5].querySelector(".pg-val"), null, "and has no value");
        window.ModelCurrentCar.abs_active = true;
        eq(PedalGraph.readModel()[5], 1, "true is 1"); eq(PedalGraph.readModel()[6], 0, "false is 0"); eq(PedalGraph.readModel()[7], 0, "missing (esc_active) is 0");
        const t0 = 240000;
        clock.step(t0);
        settings.set("pedalgraph", "markAbs", true); settings.set("pedalgraph", "markTc", true);
        ok(!has(tracks[5], "pg-off") && !has(tracks[6], "pg-off") && has(tracks[7], "pg-off"), "ABS and TC shown, ESC still off");
        clock.step(t0 + SAMPLE_MS);
        scaleIs(bars[5][state.head], 1, "ABS tick written");
        scaleIs(bars[6][state.head], 0, "TC quiet");
        ok(bars[5][0].offsetHeight < tracks[5].offsetHeight / 10, "a mark bar is a thin tick, not a full-height bar");
        ok(bars[6][0].offsetTop > bars[5][0].offsetTop, "the second mark sits in its own row below the first");
        eq(getComputedStyle(bars[5][0]).transformOrigin.split(" ")[1], "0px", "grows from the top");
        settings.set("pedalgraph", "markAbs", false); settings.set("pedalgraph", "markTc", false);
        window.ModelCurrentCar.abs_active = false;
    });

    t("plot height and trace weight are classes on the root and change the layout", function () {
        const plot = root.querySelector(".pg-plot");
        const normal = plot.offsetHeight;
        settings.set("pedalgraph", S.height, "low");
        ok(has(root, "pg-low")); ok(plot.offsetHeight < normal, "lower");
        settings.set("pedalgraph", S.height, "tall");
        ok(has(root, "pg-tall") && !has(root, "pg-low")); ok(plot.offsetHeight > normal, "taller");
        settings.set("pedalgraph", S.height, "normal");
        eq(plot.offsetHeight, normal, "back");
        eq(getComputedStyle(tracks[3]).opacity, "0.78", "normal weight, on the strip"); eq(getComputedStyle(bars[3][0]).opacity, "1", "the bars themselves are opaque, so their overlap does not double");
        settings.set("pedalgraph", S.weight, "bold");
        ok(has(root, "pg-bold")); eq(getComputedStyle(tracks[3]).opacity, "1", "bold");
        settings.set("pedalgraph", S.weight, "faint");
        ok(has(root, "pg-faint") && !has(root, "pg-bold")); eq(getComputedStyle(tracks[3]).opacity, "0.45", "faint");
        eq(getComputedStyle(tracks[5]).opacity, "0.95", "marks keep their own opacity"); eq(getComputedStyle(tracks[4]).opacity, "0.55", "so does steering");
        const pct = function (s) { const m = /^([\d.]+)%$/.exec(s); return m ? parseFloat(m[1]) : NaN; };
        ok(bars[3][1].style.left.indexOf("calc") < 0, "no calc in an inline style: Cohtml does not apply it and the bars vanish");
        near(pct(bars[3][1].style.width), pct(bars[3][1].style.left), 1e-6, "one slot wide, laid out in whole slots");
        near(pct(bars[3][2 * N].style.left), 100, 1e-6, "the spare sits just past the second half"); near(pct(bars[3][2 * N].style.width), pct(bars[3][1].style.width), 1e-6, "one slot wide like the rest");
        const cs = getComputedStyle(bars[3][1]);
        eq(cs.marginLeft, "-1.5px", "the stylesheet widens each bar 1.5 px to the LEFT, never into the slot at the left edge"); eq(cs.paddingRight, "1.5px", "and keeps its right edge where it was");
        ok(bars[3][1].getBoundingClientRect().width >= 1.5, "so no painted bar is narrower than the overlap");
        settings.set("pedalgraph", S.weight, "normal");
    });

    t("draw order: a z-index per input strip, top of the list highest, marks above all, made whole when an item is missing", function () {
        const z = function (t) { return tracks[t].style.zIndex; };
        eq(PedalGraph.ORDER_DEFAULT.join(","), "brake_percent,clutch_percent,steering_percent,handbrake_percent,gas_percent", "default: brake on top, throttle at the bottom");
        eq([z(2), z(0), z(4), z(1), z(3)].join(","), "5,4,3,2,1", "brake on top, throttle at the bottom");
        eq(getComputedStyle(tracks[5]).zIndex, "10", "marks above every input, from the stylesheet");
        eq(z(5), "", "the script never touches a mark's z-index");
        settings.set("pedalgraph", S.order, ["brake_percent", "gas_percent", "clutch_percent", "handbrake_percent", "steering_percent"]);
        eq([z(2), z(3), z(0), z(1), z(4)].join(","), "5,4,3,2,1", "reordered: brake now paints over throttle");
        eq(settings.set("pedalgraph", S.order, ["gas_percent"]).join(","), "gas_percent,brake_percent,clutch_percent,steering_percent,handbrake_percent", "a partial list is completed in the default order");
        eq(z(3), "5", "throttle on top");
        settings.reset("pedalgraph");
        eq([z(2), z(0), z(4), z(1), z(3)].join(","), "5,4,3,2,1", "reset restores the stack");
    });

    t("the wrap slot: when the incoming slot is 0 its right-hand twin is the bar at the left edge, so the live value goes to the spare bar instead", function () {
        window.ModelCurrentCar = { has_focused_car: true, gas_percent: 0.33, brake_percent: 0, clutch_percent: 0, handbrake_percent: 0, steering_percent: 0 };
        const v = PedalGraph.readModel();
        PedalGraph.measureAspect(state);                         // a view change cleared it; renderFrame is called here without a tick
        const oldN = bars[3][N].style.transform, old0 = bars[3][0].style.transform;
        state.head = N - 1; state.lastIncoming = -1; state.lastScale[3] = "";
        PedalGraph.renderFrame(state, v, 0.5);
        eq(bars[3][N].style.transform, oldN, "bar N, at the left edge, keeps its sample");
        eq(bars[3][0].style.transform, old0, "bar 0 untouched too");
        near(barTo(barOf(bars[3][2 * N])), 0.33, 1e-3, "the spare bar carries the live value at the right edge");
        eq(bars[3][1 + N].style.transform, "scaleY(0)", "and the next incoming (slot 1's right twin) is blanked");
        scaleIs(levels[3], 0.33, "the level bar still follows the live value");
        const old4 = bars[3][4].style.transform;
        state.head = 3; state.lastIncoming = -1; state.lastScale[3] = "";
        PedalGraph.renderFrame(state, v, 0.5);
        near(barTo(barOf(bars[3][4 + N])), 0.33, 1e-3, "any other slot writes its right-hand twin");
        eq(bars[3][4].style.transform, old4, "and leaves the left-hand one alone");
        eq(bars[3][5 + N].style.transform, "scaleY(0)", "the bar beyond the incoming one is blanked");
        state.head = N - 2; state.lastIncoming = -1; state.lastScale[3] = "";
        PedalGraph.renderFrame(state, v, 0.5);
        eq(bars[3][2 * N].style.transform, "scaleY(0)", "when slot N-1 is incoming, the spare is what gets blanked, ready for the wrap");
        state.head = 0; state.lastIncoming = -1;
    });

    t("every option persists: each value set to something else comes back through a reload, and so do the folds", function () {
        const specs = settings.specs("pedalgraph");
        const changed = {};
        specs.forEach(function (spec) {
            if (spec.type === "toggle") { changed[spec.key] = !settings.get("pedalgraph", spec.key); }
            if (spec.type === "range") { changed[spec.key] = Number((settings.get("pedalgraph", spec.key) + spec.step).toFixed(2)); }
            if (spec.type === "choice") { changed[spec.key] = spec.options[spec.options.length - 1]; }
            if (spec.type === "order") { changed[spec.key] = settings.get("pedalgraph", spec.key).slice().reverse(); }
            if (spec.type === "section") { settings.setCollapsed("pedalgraph", spec.key, !settings.isCollapsed("pedalgraph", spec.key)); changed[spec.key] = settings.isCollapsed("pedalgraph", spec.key); }
        });
        eq(Object.keys(changed).length, specs.length, "every spec has a persistence case: " + specs.map(function (s) { return s.type; }).join(","));
        Object.keys(changed).forEach(function (key) {
            const spec = specs.filter(function (s) { return s.key === key; })[0];
            if (spec.type !== "section") { settings.set("pedalgraph", key, changed[key]); }
        });
        // a HUD reload re-runs the script, whose define() seeds every value from the stores
        // (HUD layout store first, localStorage second); this is what it would find there
        const values = JSON.parse(localStorage.getItem(settings.localKey("pedalgraph")));
        const folds = JSON.parse(localStorage.getItem(settings.localKey("pedalgraph") + ".sections"));
        Object.keys(changed).forEach(function (key) {
            const spec = specs.filter(function (s) { return s.key === key; })[0];
            const got = spec.type === "section" ? folds[key] : values[key];
            eq(JSON.stringify(got), JSON.stringify(changed[key]), key + " is in the store a reload reads");
        });
        eq(root.style.fontSize, changed.scale + "rem", "and the live widget shows the changed scale");
        settings.reset("pedalgraph");
        specs.forEach(function (spec) { if (spec.type === "section") { settings.setCollapsed("pedalgraph", spec.key, Boolean(spec.collapsed)); } });
    });

    t("re-attach applies the stored options, and Reset to defaults puts everything back", function () {
        settings.set("pedalgraph", "showClutch", false); settings.set("pedalgraph", S.levels, false);
        settings.set("pedalgraph", S.bg, "none"); settings.set("pedalgraph", "scale", 1.3); settings.set("pedalgraph", S.window, "10 s");
        settings.set("pedalgraph", "showSteering", true); settings.set("pedalgraph", S.height, "tall");
        PedalGraph.detach(state); state = PedalGraph.attach(root);
        ok(has(tracks[0], "pg-off"), "clutch still off after re-attach"); ok(has(root, "pg-nolevels")); ok(has(root, "pg-bg-none"));
        ok(!has(tracks[4], "pg-off"), "steering still on"); ok(has(root, "pg-tall"));
        eq(root.style.fontSize, "1.3rem", "scale restored"); near(state.sampler.periodMs, 40, 1e-9, "window restored");
        eq(settings.listenerCount("pedalgraph"), 2, "one listener for the widget and one for me.scale, not a pile");
        settings.reset("pedalgraph");
        ok(!has(tracks[0], "pg-off"), "clutch back"); ok(!has(root, "pg-nolevels")); ok(!has(root, "pg-bg-none"));
        ok(has(tracks[4], "pg-off"), "steering back off"); ok(!has(root, "pg-tall"));
        eq(root.style.fontSize, "1rem", "scale back"); near(state.sampler.periodMs, 20, 1e-9, "window back");
        eq(state.attract, false);
    });

    t("detach stops the loop and releases listeners; re-attach reuses the markup", function () {
        const barCount = root.querySelectorAll(".pg-bar").length;
        const cancelledBefore = clock.cancelled;
        const listenersBefore = settings.listenerCount("pedalgraph");
        PedalGraph.detach(state);
        eq(settings.listenerCount("pedalgraph"), listenersBefore - 2, "settings listeners released (the widget's and me.scale's)");
        eq(clock.cancelled, cancelledBefore + 1, "frame cancelled");
        eq(clock.queue.length, 0, "queue empty");
        eq(state.ui.loop.rafId, 0, "rafId cleared"); eq(state.ui.loop.running, false, "loop stopped");
        const left = root.style.left;
        mouse("mousedown", 0, 0, root); mouse("mousemove", 700, 700); mouse("mouseup", 0, 0);
        eq(root.style.left, left, "listeners released");
        ok(!root.classList.contains("dragging"), "not dragging");
        state = PedalGraph.attach(root);
        eq(root.querySelectorAll(".pg-bar").length, barCount, "markup reused, not rebuilt");
        eq(clock.queue.length, 1, "loop restarted");
        PedalGraph.detach(state);
    });

    H.finish();
}());
</script>
</body>
</html>
