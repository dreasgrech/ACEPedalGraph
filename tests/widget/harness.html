<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PedalGraph widget tests</title>
<style>
  body { margin: 0; background: #222; color: #ddd; font: 12px monospace; }
  /* stand-in for the game's HUD container */
  .absolutecenter { position: relative; width: 1600px; height: 900px; overflow: hidden; }
  #results { white-space: pre; }
</style>
<script>
// ---- test doubles, installed before the library and the widget load ------------------

// Manual animation-frame clock: tests call __clock.step(t) to run queued callbacks.
window.__clock = {
    queue: [], nextId: 1, cancelled: 0,
    step: function (t) {
        const run = this.queue; this.queue = [];
        run.forEach(function (q) { q[1](t); });
    }
};
window.requestAnimationFrame = function (cb) { const id = window.__clock.nextId++; window.__clock.queue.push([id, cb]); return id; };
window.cancelAnimationFrame = function (id) {
    const n = window.__clock.queue.length;
    window.__clock.queue = window.__clock.queue.filter(function (q) { return q[0] !== id; });
    if (window.__clock.queue.length !== n) { window.__clock.cancelled++; }
};

// In-memory localStorage so file:// origin quirks cannot affect the tests.
const __store = {};
Object.defineProperty(window, "localStorage", { value: {
    getItem: function (k) { return (k in __store) ? __store[k] : null; },
    setItem: function (k, v) { __store[k] = String(v); },
    removeItem: function (k) { delete __store[k]; },
    clear: function () { Object.keys(__store).forEach(function (k) { delete __store[k]; }); }
}});

// Fake car model, mutable by tests.
window.ModelCurrentCar = { has_focused_car: true, gas_percent: 0.5, brake_percent: 0.25, clutch_percent: 0, handbrake_percent: 1 };
window.PEDALGRAPH_SOURCE = "harness";

// Capture console output so it can be asserted on and shown in the dump.
window.__log = [];
const __origLog = console.log.bind(console);
console.log = function () { const a = Array.prototype.slice.call(arguments); window.__log.push(a.join(" ")); __origLog.apply(null, a); };
</script>
<!-- the AceMods library from the sibling ACEUIModLoader checkout, in load order (in game it is part of cohtml.js) -->
<script src="../../../ACEUIModLoader/src/acemods.core.js"></script>
<script src="../../../ACEUIModLoader/src/acemods.console.js"></script>
<script src="../../../ACEUIModLoader/src/acemods.persist.js"></script>
<script src="../../../ACEUIModLoader/src/acemods.panel.js"></script>
<script src="../../../ACEUIModLoader/src/acemods.loop.js"></script>
<script src="../../../ACEUIModLoader/src/acemods.loader.js"></script>
<link rel="stylesheet" type="text/css" href="../../src/pedalgraph.css">
<!-- classic script, as the loader injects it: `PedalGraph` is a page-wide binding -->
<script src="../../src/pedalgraph.js"></script>
</head>
<body>
<div class="absolutecenter" id="center"></div>
<pre id="results"></pre>
<div id="done" hidden></div>

<script>
(function () {
    const results = [];
    const t = function (name, fn) {
        try { fn(); results.push({ name: name, pass: true }); }
        catch (e) { results.push({ name: name, pass: false, msg: String(e && e.message || e) }); }
    };
    const eq = function (a, b, what) { if (a !== b) { throw new Error((what || "") + " expected " + JSON.stringify(b) + " got " + JSON.stringify(a)); } };
    const ok = function (c, what) { if (!c) { throw new Error(what || "assertion failed"); } };
    const near = function (a, b, eps, what) { if (Math.abs(a - b) > eps) { throw new Error((what || "") + " expected ~" + b + " got " + a); } };
    const scaleOf = function (el) { const m = /scaleY\((-?[\d.]+)\)/.exec(el.style.transform || ""); return m ? parseFloat(m[1]) : 0; };
    const scaleIs = function (el, v, what) { near(scaleOf(el), v, 1e-6, what); };

    const N = 250, HZ = 50, SAMPLE_MS = 1000 / HZ;
    const clock = window.__clock;
    const center = document.getElementById("center");

    t("library present, module present, constants as expected, load logged", function () {
        eq(typeof AceMods, "object", "AceMods library"); eq(typeof AceMods.panel, "object", "panel"); eq(typeof AceMods.loop, "object", "loop");
        eq(typeof PedalGraph, "object", "PedalGraph module");
        eq(PedalGraph.N, N, "N"); eq(PedalGraph.SAMPLE_HZ, HZ, "SAMPLE_HZ");
        ok(window.__log.some(function (l) { return l.indexOf("[PedalGraph] script loaded, version=" + PedalGraph.VERSION + ", source=harness, lib=" + AceMods.VERSION) >= 0; }), "no load log");
        eq(document.getElementById(PedalGraph.ROOT_ID), null, "harness must not carry the auto-boot root");
        eq(typeof PedalGraph.VERSION, "string", "version exported");
    });

    const root = document.createElement("div");
    center.appendChild(root);
    let state = PedalGraph.attach(root);
    let tracks, bars, levels, vals;
    const grab = function () {
        tracks = Array.prototype.slice.call(root.querySelectorAll(".pg-track"));
        bars = tracks.map(function (el) { return Array.prototype.slice.call(el.querySelectorAll(".pg-bar")); });
        levels = Array.prototype.slice.call(root.querySelectorAll(".pg-lvl > div"));
        vals = Array.prototype.slice.call(root.querySelectorAll(".pg-val"));
    };
    grab();

    t("attach builds 4 tracks x 2N bars, 4 levels, 4 readouts; panel and loop wired", function () {
        eq(tracks.length, 4, "tracks"); bars.forEach(function (b) { eq(b.length, 2 * N, "bars"); });
        eq(levels.length, 4, "levels"); eq(vals.length, 4, "vals");
        eq(getComputedStyle(root).position, "absolute", "stylesheet applied");
        ok(root.classList.contains("ace-pedalgraph"), "root class");
        eq(clock.queue.length, 1, "one animation frame requested");
        eq(state.root, root, "state carries the root");
        eq(state.panel.root, root, "panel attached to the root"); eq(state.panel.hudId, PedalGraph.HUD_ELEMENT_ID); eq(state.panel.storageKey, PedalGraph.STORAGE_KEY);
        eq(root.style.visibility, "hidden", "hidden until positioned");
        ok(state.loop && state.loop.running, "loop running");
    });

    // trace order in the script: 0 clutch, 1 handbrake, 2 brake, 3 gas
    t("first frame samples nothing but renders live values and readouts", function () {
        clock.step(1000);
        eq(vals[3].textContent, "50%", "gas readout");
        eq(vals[1].textContent, "100%", "handbrake readout");
        scaleIs(levels[3], 0.5, "gas level");
        eq(root.querySelector(".pg-nodata").textContent, "", "nodata cleared");
    });

    t("history commits at the fixed rate into slot head+1 in both halves", function () {
        clock.step(1000 + SAMPLE_MS);          // exactly one sample period later
        scaleIs(bars[3][1], 0.5, "slot 1");
        scaleIs(bars[3][1 + N], 0.5, "slot 1+N");
        scaleIs(bars[3][2], 0.5, "slot 2 is the incoming live bar");
        scaleIs(bars[3][3], 0.0, "slot 3 untouched");
        eq(state.head, 1, "head advanced");
    });

    t("strip slides continuously between samples", function () {
        const shiftAt = function (frac) { return -((1 + 1 + frac) / (2 * N)) * 100; };   // head is 1
        clock.step(1000 + SAMPLE_MS + SAMPLE_MS / 2);
        const m = /translateX\((-?[\d.]+)%\)/.exec(tracks[3].style.transform);
        ok(m, "no translate"); near(parseFloat(m[1]), shiftAt(0.5), 0.001, "half-way shift");
    });

    t("catches up after a short hitch without dropping history", function () {
        window.ModelCurrentCar.gas_percent = 0.8;
        clock.step(1000 + SAMPLE_MS * 6);       // 6 periods since start => slots 1..6 committed
        let i;
        for (i = 2; i <= 6; i += 1) { scaleIs(bars[3][i], 0.8, "slot " + i); }
        scaleIs(bars[3][7], 0.8, "incoming slot 7 holds live value");
        scaleIs(bars[3][8], 0.0, "slot 8 untouched");
        eq(state.head, 6, "head");
    });

    t("a stall longer than the window resets the clock instead of replaying", function () {
        window.ModelCurrentCar.gas_percent = 0.1;
        clock.step(1000 + SAMPLE_MS * 6 + 20000);   // 20 s stall
        scaleIs(bars[3][7], 0.1, "incoming slot got live value");
        scaleIs(bars[3][8], 0.0, "no mass replay into slot 8");
        eq(state.head, 6, "head unchanged by the stall");
        clock.step(1000 + SAMPLE_MS * 6 + 20000 + SAMPLE_MS);
        scaleIs(bars[3][7], 0.1, "slot 7 committed");
        scaleIs(bars[3][8], 0.1, "slot 8 is the new incoming");
    });

    t("values are clamped to 0..1 and readouts only update on change", function () {
        window.ModelCurrentCar.gas_percent = 1.7;
        window.ModelCurrentCar.brake_percent = -0.4;
        const t0 = 60000;
        clock.step(t0);
        scaleIs(levels[3], 1.0, "gas clamped high");
        scaleIs(levels[2], 0.0, "brake clamped low");
        eq(vals[3].textContent, "100%"); eq(vals[2].textContent, "0%");
        const el = vals[3]; el.textContent = "sentinel";
        clock.step(t0 + 1);
        eq(el.textContent, "sentinel", "unchanged value must not rewrite the readout");
    });

    t("no focused car: nothing renders, sampler resets, no throw", function () {
        const before = tracks[3].style.transform;
        window.ModelCurrentCar.has_focused_car = false;
        clock.step(70000); clock.step(70016);
        eq(tracks[3].style.transform, before, "strip must not move");
        eq(state.sampler.lastSampleAt, 0, "sampler reset");
        eq(PedalGraph.readModel(), null, "readModel null without focused car");
        window.ModelCurrentCar = null;
        clock.step(70032);
        eq(PedalGraph.readModel(), null, "readModel null without model");
        window.ModelCurrentCar = { has_focused_car: true, gas_percent: 0.3, brake_percent: 0, clutch_percent: 0, handbrake_percent: 0 };
        clock.step(70048);
        scaleIs(levels[3], 0.3, "recovers when the model is back");
    });

    t("hidden HUD skips drawing but keeps recording", function () {
        document.body.classList.add(AceMods.HUD_HIDDEN_CLASS);
        const before = tracks[3].style.transform;
        const headBefore = state.head;
        clock.step(80000);
        clock.step(80000 + SAMPLE_MS * 3);
        eq(tracks[3].style.transform, before, "no draw while hidden");
        ok(state.head > headBefore, "history still recording");
        document.body.classList.remove(AceMods.HUD_HIDDEN_CLASS);
        clock.step(80000 + SAMPLE_MS * 3 + 1);
        ok(tracks[3].style.transform !== before, "draws again when visible");
    });

    const mouse = function (type, x, y, target) {
        (target || window).dispatchEvent(new MouseEvent(type, { clientX: x, clientY: y, bubbles: true }));
    };
    const makeHud = function (elements) {
        const hud = { currentLayout: "default", StoredData: { lastLayout: "default", layouts: { default: { elements: elements || {} } } } };
        hud.elementModified = function (id, props) { hud.StoredData.layouts.default.elements[id] = props; };
        return hud;
    };

    t("drag saves under PedalGraph's keys in localStorage and the stock HUD store", function () {
        window.HUD = makeHud();
        root.style.left = "100px"; root.style.top = "100px"; root.style.bottom = "auto";
        const r = root.getBoundingClientRect();
        mouse("mousedown", r.left + 10, r.top + 10, root);
        ok(root.classList.contains("dragging"), "dragging class for the stylesheet");
        mouse("mousemove", r.left + 210, r.top + 60); mouse("mouseup", 0, 0);
        eq(root.style.left, "300px", "moved");
        const c = center.getBoundingClientRect();
        const saved = JSON.parse(localStorage.getItem(PedalGraph.STORAGE_KEY));
        near(saved.fx, 300 / c.width, 0.001, "fx"); eq(saved.x, "300px", "pixel form kept");
        const entry = window.HUD.StoredData.layouts.default.elements[PedalGraph.HUD_ELEMENT_ID];
        ok(entry && entry.x === "300px", "HUD store entry under hud_pedalgraph");
        ok(window.__log.some(function (l) { return l.indexOf("[PedalGraph] position saved") >= 0 && l.indexOf("hud layout") >= 0; }), "save logged with the mod prefix");
        window.HUD = null; localStorage.clear();
    });

    t("position is restored from the HUD store inside the frame loop and the widget is then shown", function () {
        window.HUD = makeHud({});
        window.HUD.StoredData.layouts.default.elements[PedalGraph.HUD_ELEMENT_ID] = { fx: 0.25, fy: 0.5 };
        const root2 = document.createElement("div");
        center.appendChild(root2);
        const state2 = PedalGraph.attach(root2);
        eq(root2.style.visibility, "hidden", "hidden until placed"); eq(root2.style.left, "", "nothing applied synchronously");
        clock.step(105000);
        const c = center.getBoundingClientRect();
        eq(root2.style.left, Math.round(0.25 * c.width) + "px", "restored left"); eq(root2.style.top, Math.round(0.5 * c.height) + "px", "restored top");
        ok(state2.panel.restored, "settled"); eq(root2.style.visibility, "", "shown");
        PedalGraph.detach(state2); root2.remove(); window.HUD = null;
    });

    t("detach stops the loop and releases listeners; re-attach reuses the markup", function () {
        const barCount = root.querySelectorAll(".pg-bar").length;
        const cancelledBefore = clock.cancelled;
        PedalGraph.detach(state);
        eq(clock.cancelled, cancelledBefore + 1, "frame cancelled");
        eq(clock.queue.length, 0, "queue empty");
        eq(state.loop.rafId, 0, "rafId cleared"); eq(state.loop.running, false, "loop stopped");
        const left = root.style.left;
        mouse("mousedown", 0, 0, root); mouse("mousemove", 700, 700); mouse("mouseup", 0, 0);
        eq(root.style.left, left, "listeners released");
        ok(!root.classList.contains("dragging"), "not dragging");
        state = PedalGraph.attach(root);
        eq(root.querySelectorAll(".pg-bar").length, barCount, "markup reused, not rebuilt");
        eq(clock.queue.length, 1, "loop restarted");
        PedalGraph.detach(state);
    });

    const passed = results.filter(function (r) { return r.pass; }).length;
    document.getElementById("results").textContent =
        results.map(function (r) { return (r.pass ? "PASS " : "FAIL ") + r.name + (r.msg ? "  -- " + r.msg : ""); }).join("\n") +
        "\nSUMMARY " + passed + "/" + results.length;
    document.getElementById("done").hidden = false;
    document.getElementById("done").textContent = "DONE";
}());
</script>
</body>
</html>
